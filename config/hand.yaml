# RH56F2 Hand Configuration
# Used by rh56f2_driver node

hand:
  id: 1
  port: "/dev/ttyUSB0"
  baudrate: 115200
  update_rate: 50   # Hz — state publish frequency

  # Default parameters (written at startup)
  defaults:
    speed: [1500, 1500, 1500, 1500, 1500, 1500]    # moderate speed
    force_threshold: [500, 500, 500, 500, 500, 500]  # safe default force limit
    mode: [0, 0, 0, 0, 0, 0]                         # speed-force-protect mode

  # Finger to joint index mapping
  fingers:
    little:      0
    ring:        1
    middle:      2
    index:       3
    thumb_bend:  4
    thumb_rotate: 5

  # Motion mode descriptions (from F2 manual)
  modes:
    0: "speed_force_protect"   # move to target angle, stop if force exceeded
    1: "force_closed_loop"     # follow set force continuously
    2: "impedance"             # dynamic force-position balance
