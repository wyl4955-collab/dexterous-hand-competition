# Camera configuration (Intel RealSense D435i or standard USB camera)

camera:
  type: "realsense"      # "realsense" or "usb"
  device_id: 0
  resolution: [1280, 720]
  fps: 30

  # Table plane calibration
  # 4 marker points on the table, measured in mm from table origin
  table_markers_mm:
    - [0, 0]
    - [200, 0]
    - [200, 150]
    - [0, 150]

  # Calibration file (generated by calibration tool)
  calibration_file: "config/camera_calibration.pkl"

# Bean detection parameters (HSV ranges — need tuning for actual beans and lighting)
bean_detection:
  soybean_hsv_lower: [15, 50, 50]
  soybean_hsv_upper: [35, 255, 255]
  min_area: 30
  max_area: 500
  min_circularity: 0.5

# Scale reader
scale:
  type: "serial"         # "serial" or "camera_ocr"
  port: "/dev/ttyUSB1"
  baudrate: 9600
  # For camera OCR mode: camera_id and ROI for the scale display
  camera_id: 1
  roi: [100, 200, 300, 100]  # [x, y, w, h] of scale display in image
