# Pre-defined hand poses for competition tasks
# Angles in 0.1-degree units (per F2 manual Table 35)
# Four fingers: 900(closed) ~ 1740(open)
# Thumb bend:   1100(closed) ~ 1550(open)
# Thumb rotate: 600 ~ 1750
# -1 means "don't move this finger"

poses:
  # ──── General ────
  open_all:
    description: "All fingers fully open"
    angles: [1740, 1740, 1740, 1740, 1550, 1750]
    speed: 1500
    force: 500

  rest:
    description: "Resting position (slightly curled)"
    angles: [1600, 1600, 1600, 1600, 1400, 1700]
    speed: 1000
    force: 300

  # ──── Precision grip (thumb + index) ────
  pinch_wide:
    description: "Thumb+index pinch, wide open (ready to grasp)"
    angles: [1740, 1740, 1740, 1500, 1350, 1200]
    speed: 300
    force: 30

  pinch_bean_grasp:
    description: "Thumb+index closed for grasping a bean"
    angles: [1740, 1740, 1740, 1150, 1150, 1200]
    speed: 150
    force: 40        # ⭐ critical: 40g for soybean

  pinch_bean_hold:
    description: "Thumb+index holding a bean (anti-slip)"
    angles: [1740, 1740, 1740, 1150, 1150, 1200]
    speed: 200
    force: 55        # slightly higher to prevent slip

  # ──── Tool grip ────
  grip_tweezers:
    description: "Thumb+index gripping tweezers"
    angles: [1740, 1740, 1740, 1250, 1250, 1200]
    speed: 300
    force: 100       # grip tweezers firmly but not too tight

  grip_spoon:
    description: "Thumb+index gripping a medicine spoon"
    angles: [1740, 1740, 1740, 1280, 1250, 1200]
    speed: 400
    force: 180       # spoon is heavier than tweezers

  # ──── Finger tap (powder vibration) ────
  tap_ring_finger:
    description: "Ring finger tap position for powder vibration"
    angles: [1740, 1200, 1740, -1, -1, -1]   # only ring finger moves
    speed: 3000
    force: 80

  tap_ring_return:
    description: "Ring finger return after tap"
    angles: [1740, 1700, 1740, -1, -1, -1]
    speed: 3000
    force: 80

  # ──── Pouring ────
  pour_spoon:
    description: "Loosen grip slightly for spoon tilting"
    angles: [1740, 1740, 1740, -1, -1, -1]  # keep index+thumb, relax others
    speed: 500
    force: 150
