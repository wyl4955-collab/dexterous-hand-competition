# Competition System Configuration

# ── Hand (RH56F2 via RS485) ──
hand:
  port: "/dev/ttyUSB0"
  baudrate: 115200
  id: 1
  rate: 50  # Hz

# ── Scale (0.01g precision) ──
scale:
  port: "/dev/ttyUSB1"
  baudrate: 9600

# ── Camera ──
camera:
  type: "usb"          # "usb" or "realsense"
  device_id: 0
  width: 1280
  height: 720
  fps: 30

# ── Tasks ──
powder_weighing:
  target: 5.00          # grams
  tolerance: 0.05       # ± grams
  timeout: 120.0        # seconds
  tap_force_drop:       # grams per tap at each force level
    30: 0.01
    50: 0.02
    80: 0.04
    120: 0.08
    180: 0.15
    250: 0.30

bean_picking:
  count: 3              # beans to move
  timeout: 120.0        # seconds
  max_retries: 3
  grasp_force: 40       # grams
  hold_force: 60        # grams (anti-slip)
  max_force: 80         # grams (cracking threshold)

# ── Arm waypoints (mm, table frame) ──
waypoints:
  home: [100, 75, 200]
  powder_container: [50, 20, 80]
  scale_above: [150, 75, 60]
  bean_area: [100, 120, 80]
  bean_container: [180, 30, 80]
  bean_drop: [180, 30, 20]
  tweezers_pickup: [20, 140, 40]
  spoon_pickup: [20, 160, 40]
